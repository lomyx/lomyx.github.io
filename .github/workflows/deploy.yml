name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Or 'master', depending on your default branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Inject API Key
        # This replaces the placeholder text in index.html with the secret from GitHub Settings
        run: |
          sed -i 's/INSERT_YOUR_GEMINI_API_KEY_HERE/${{ secrets.GEMINI_API_KEY }}/g' index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./